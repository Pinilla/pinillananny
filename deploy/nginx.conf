# The #PINILLANANNY server block in /etc/nginx/conf.d/http.conf.
server {
    listen 443 ssl;
    server_name nanny.pinillaweb.org;
    ssl_certificate /etc/letsencrypt/live/abs.pinillaweb.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abs.pinillaweb.org/privkey.pem;
    include snippets/hsts.conf;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
